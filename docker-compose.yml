services:
  postgres:
    image: postgres:16
    container_name: Gelatiamocafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gelatiamo_db}
      POSTGRES_USER: ${POSTGRES_USER:-gelatiamo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gelatiamo_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - cafe_pgdata:/var/lib/postgresql/data
    healthcheck:
     
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gelatiamo_user} -d ${POSTGRES_DB:-gelatiamo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cafe_pgdata: